services:
  postgres:
    image: paradedb/paradedb:0.24.0-pg17
    container_name: aiqasys-postgres
    environment:
      POSTGRES_USER: aiqasys
      POSTGRES_PASSWORD: aiqasys
      POSTGRES_DB: aiqasys
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiqasys -d aiqasys"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: aiqasys-api:local
    container_name: aiqasys-db-migrate
    command: ["uv", "run", "python", "scripts/migrate_postgres.py"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://aiqasys:aiqasys@postgres:5432/aiqasys}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: aiqasys-api:local
    container_name: aiqasys-api
    command: ["uv", "run", "python", "main.py", "api", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://aiqasys:aiqasys@postgres:5432/aiqasys}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-1}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-8}
      PG_HNSW_EF_SEARCH: ${PG_HNSW_EF_SEARCH:-100}
      QA_GRAPH_BACKEND: csv
      KG_DATA_DIR: data/curated
      AGENT_TASK_DIR: data/agent_tasks
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password123
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: "2048"
      QA_HISTORY_MAX_TURNS: ${QA_HISTORY_MAX_TURNS:-3}
      QA_HISTORY_MAX_CHARS: ${QA_HISTORY_MAX_CHARS:-4000}
      QA_HISTORY_COMPRESSION_ENABLED: ${QA_HISTORY_COMPRESSION_ENABLED:-true}
      QA_HISTORY_SUMMARY_MAX_CHARS: ${QA_HISTORY_SUMMARY_MAX_CHARS:-1600}
      QA_HISTORY_COMPRESSION_CHUNK_CHARS: ${QA_HISTORY_COMPRESSION_CHUNK_CHARS:-12000}
    ports:
      - "8000:8000"
    volumes:
      - conversations:/app/data/conversations
      - agent_tasks:/app/data/agent_tasks
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  web:
    image: node:22-alpine
    container_name: aiqasys-web
    working_dir: /app/web
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - web_node_modules:/app/web/node_modules
    depends_on:
      - api

  neo4j:
    image: neo4j:5.26-community
    container_name: aiqasys-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  agent_tasks:
  conversations:
  neo4j_data:
  neo4j_logs:
  postgres_data:
  web_node_modules:
