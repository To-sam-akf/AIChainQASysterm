[project]
name = "aiqasys"
version = "0.1.0"
description = "Evidence-driven AI compute industry chain GraphRAG QA agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "cryptography>=42",
    "fastapi>=0.115,<0.116",
    "jieba>=0.42.1",
    "langchain-core>=1.4,<1.5",
    "langgraph>=1.2,<1.3",
    "neo4j>=5.20",
    "pydantic>=2.0,<3.0",
    "PyMuPDF>=1.24",
    "pypdf>=5.0",
    "pgvector>=0.4,<0.5",
    "psycopg[binary,pool]>=3.2,<3.3",
    "rank-bm25>=0.2.2",
    "requests>=2.31",
    "uvicorn>=0.30",
    "mcp>=1.27,<2",
]

[project.scripts]
aika = "src.aika_cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<0.28",
    "pytest>=8.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<0.28",
    "pytest>=8.0",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: requires an external service such as PostgreSQL",
]
