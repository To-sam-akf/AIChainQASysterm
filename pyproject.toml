[project]
name = "aika-research-mcp"
version = "0.1.2pro"
description = "Evidence-driven AI compute industry-chain research MCP server and local SQLite CLI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Copyright (c) AIKA Contributors. All rights reserved." }
authors = [
    { name = "AIKA Contributors" },
]
keywords = ["AIKA", "MCP", "research", "GraphRAG", "AI compute", "SQLite"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "jinja2>=3.1,<4",
    "mcp>=1.27,<2",
    "pydantic>=2.0,<3.0",
]

[project.urls]
Homepage = "https://github.com/To-sam-akf/AIChainQASysterm"
Repository = "https://github.com/To-sam-akf/AIChainQASysterm"
Issues = "https://github.com/To-sam-akf/AIChainQASysterm/issues"

[project.scripts]
aika = "aika.aika_cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project.optional-dependencies]
full = [
    "beautifulsoup4>=4.12",
    "cryptography>=42",
    "fastapi>=0.115,<0.116",
    "jieba>=0.42.1",
    "langchain-core>=1.4,<1.5",
    "langgraph>=1.2,<1.3",
    "neo4j>=5.20",
    "pgvector>=0.4,<0.5",
    "psycopg[binary,pool]>=3.2,<3.3",
    "PyMuPDF>=1.24",
    "pypdf>=5.0",
    "rank-bm25>=0.2.2",
    "requests>=2.31",
    "uvicorn>=0.30",
]
dev = [
    "beautifulsoup4>=4.12",
    "cryptography>=42",
    "fastapi>=0.115,<0.116",
    "httpx>=0.27,<0.28",
    "jieba>=0.42.1",
    "langchain-core>=1.4,<1.5",
    "langgraph>=1.2,<1.3",
    "neo4j>=5.20",
    "pgvector>=0.4,<0.5",
    "psycopg[binary,pool]>=3.2,<3.3",
    "PyMuPDF>=1.24",
    "pypdf>=5.0",
    "pytest>=8.0",
    "rank-bm25>=0.2.2",
    "requests>=2.31",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "beautifulsoup4>=4.12",
    "cryptography>=42",
    "fastapi>=0.115,<0.116",
    "httpx>=0.27,<0.28",
    "jieba>=0.42.1",
    "langchain-core>=1.4,<1.5",
    "langgraph>=1.2,<1.3",
    "neo4j>=5.20",
    "pgvector>=0.4,<0.5",
    "psycopg[binary,pool]>=3.2,<3.3",
    "PyMuPDF>=1.24",
    "pypdf>=5.0",
    "pytest>=8.0",
    "rank-bm25>=0.2.2",
    "requests>=2.31",
    "uvicorn>=0.30",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["aika"]

[tool.hatch.build.targets.wheel.force-include]
"data/knowledge_packs/sample" = "aika/aika_core/bundled_sample"
"skills/aika-research" = "aika/bundled_skills/aika-research"

[tool.hatch.build.targets.sdist]
include = [
    "/aika",
    "/skills/aika-research",
    "/data/knowledge_packs/sample",
    "/scripts/build_sample_pack.py",
    "/README.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: requires an external service such as PostgreSQL",
]
